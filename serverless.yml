service: appointment-scheduler
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs16.x
  region: us-east-1

plugins:
  - serverless-plugin-typescript
  - serverless-dotenv-plugin
  - serverless-offline

functions:
  health:
    handler: src/handlers/healthHandler.healthCheck
    events:
      - http:
          path: health
          method: get
