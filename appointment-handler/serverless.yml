service: appointment-handler

useDotenv: true

plugins:
  - serverless-dotenv-plugin
  - serverless-offline

provider:
  name: aws
  runtime: nodejs16.x
  region: us-east-2
  environment:
    EVENT_BUS_NAME: ${env:EVENT_BUS_NAME}
    MYSQL_HOST: ${env:MYSQL_HOST}
    MYSQL_USER: ${env:MYSQL_USER}
    MYSQL_PASSWORD: ${env:MYSQL_PASSWORD}
    MYSQL_DB: ${env:MYSQL_DB}

functions:
  handleAppointmentPE:
    handler: handlers/pe-handler.main
    events:
      - sqs:
          arn: ${env:SQS_QUEUE_ARN_PE}

  handleAppointmentCL:
    handler: handlers/cl-handler.main
    events:
      - sqs:
          arn: ${env:SQS_QUEUE_ARN_CL}
